services:
  teilen-dev:
    container_name: teilen-dev-app
    image: python:3.14.7-alpine@sha256:4677924bcc0e94505a3270e87cb1601c2af54cd92d021b8dc306618a14333bbe
    init: true
    ports:
      - "5000:27183"
    volumes:
      - "./:/teilen"
    working_dir: "/teilen"
    command: [ "sh", "-c", "pip install --uploaded-prior-to P14D -e '.[dev]' && python app.dev.py" ]
